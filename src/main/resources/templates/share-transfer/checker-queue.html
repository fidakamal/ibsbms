<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Share Transfer Checker</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-1">Share Transfer Checker</h2>
            <p class="text-muted mb-0">
                Pending share transfer requests
            </p>
        </div>

        <a href="/dashboard"
           class="btn btn-outline-secondary">
            Back
        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>
                        <th>Transfer Ref</th>
                        <th>Type</th>
                        <th>Business Date</th>
                        <th>Source</th>
                        <th>Destination</th>
                        <th>Shares</th>
                        <th>Maker</th>
                        <th>Submitted</th>
                        <th>Status</th>
                        <th></th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="request : ${requests}">

                        <td>
                            <strong th:text="${request.trId}">
                                TR-ID
                            </strong>
                        </td>

                        <td th:text="${request.transferType}">
                            F2F
                        </td>

                        <td th:text="${request.businessDate}">
                            2026-09-24
                        </td>

                        <td th:text="${request.source}">
                            1478966559
                        </td>

                        <td th:text="${request.destination}">
                            1478966556
                        </td>

                        <td th:text="${request.quantity}">
                            100
                        </td>

                        <td th:text="${request.makerId}">
                            test.maker
                        </td>

                        <td th:text="${request.submittedAt}">
                            2026-09-24 10:00
                        </td>

                        <td>

                            <span
                                    class="badge bg-warning text-dark"
                                    th:text="${request.status}">
                                PENDING_CHECKER
                            </span>

                        </td>

                        <td>

                            <a
                                    th:href="@{/share-transfer/checker/{trId}(trId=${request.trId})}"
                                    class="btn btn-sm btn-primary">
                                Review
                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(requests)}">

                        <td colspan="10"
                            class="text-center text-muted py-5">

                            No pending share transfer requests.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
