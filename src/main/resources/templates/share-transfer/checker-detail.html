<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Share Transfer Review</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Share Transfer Review</h3>
            <p class="text-muted mb-0">
                Review the transfer before taking an action.
            </p>
        </div>

        <a href="/share-transfer/checker"
           class="btn btn-outline-secondary">
            ← Back to Queue
        </a>
    </div>


    <!-- Transfer Information -->

    <div class="card shadow-sm mb-4">

        <div class="card-header">
            <strong>Transfer Information</strong>
        </div>

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Transfer Reference
                    </label>
                    <div class="fw-semibold"
                         th:text="${detail.trId}">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Transfer Type
                    </label>
                    <div class="fw-semibold"
                         th:text="${detail.transferType}">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Business Date
                    </label>
                    <div class="fw-semibold"
                         th:text="${detail.businessDate}">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Source
                    </label>
                    <div class="fw-semibold"
                         th:text="${detail.source}">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Destination
                    </label>
                    <div class="fw-semibold"
                         th:text="${detail.destination}">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Quantity
                    </label>
                    <div class="fw-semibold"
                         th:text="${detail.quantity}">
                    </div>
                </div>

            </div>

        </div>
    </div>


    <!-- Maker Information -->

    <div class="card shadow-sm mb-4">

        <div class="card-header">
            <strong>Maker Information</strong>
        </div>

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Maker
                    </label>
                    <div th:text="${detail.makerId}">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Maker IP
                    </label>
                    <div th:text="${detail.makerIp}">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Submitted
                    </label>
                    <div th:text="${detail.submittedAt}">
                    </div>
                </div>

            </div>

        </div>
    </div>


    <!-- Instrument / Remarks -->

    <div class="card shadow-sm mb-4">

        <div class="card-header">
            <strong>Transfer Details</strong>
        </div>

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Instrument No.
                    </label>
                    <div th:text="${detail.instrumentNo ?: '—'}">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Instrument Date
                    </label>
                    <div th:text="${detail.instrumentDate ?: '—'}">
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label text-muted">
                        Status
                    </label>
                    <span class="badge bg-warning text-dark"
                          th:text="${detail.status}">
                    </span>
                </div>

                <div class="col-12">
                    <label class="form-label text-muted">
                        Particulars
                    </label>
                    <div class="border rounded p-3 bg-light"
                         th:text="${detail.particulars ?: '—'}">
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label text-muted">
                        Remarks
                    </label>
                    <div class="border rounded p-3 bg-light"
                         th:text="${detail.remarks ?: '—'}">
                    </div>
                </div>

            </div>

        </div>
    </div>


    <!-- Actions -->

    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Checker Actions</strong>
        </div>

        <div class="card-body">

            <div class="d-flex gap-2">

                <button type="button"
                        class="btn btn-success"
                        disabled>
                    Approve
                </button>

                <button type="button"
                        class="btn btn-warning"
                        disabled>
                    Return for Modification
                </button>

                <button type="button"
                        class="btn btn-danger"
                        disabled>
                    Reject
                </button>

            </div>

            <small class="text-muted d-block mt-3">
                Approval, return, and rejection will be enabled in the
                next step after the review page is verified.
            </small>

        </div>

    </div>

</div>

</body>
</html>
