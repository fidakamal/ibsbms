<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>IBSBMS - Dashboard</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>


<!-- Main Content -->
<main class="main-content">

    <div class="page-content">

        <h4 class="mb-1">
            Dashboard
        </h4>

        <p class="text-muted mb-4">
            Islami Bank Share & Bond Management System
        </p>


        <!-- Statistics -->

        <div class="row g-4">

            <div class="col-md-3">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <p class="text-muted mb-2">
                            Total Shareholders
                        </p>

                        <h3 class="mb-0">
                            1,470
                        </h3>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <p class="text-muted mb-2">
                            Active Accounts
                        </p>

                        <h3 class="mb-0">
                            1,320
                        </h3>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <p class="text-muted mb-2">
                            Pending Approval
                        </p>

                        <h3 class="mb-0">
                            12
                        </h3>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <p class="text-muted mb-2">
                            Dormant Accounts
                        </p>

                        <h3 class="mb-0">
                            138
                        </h3>

                    </div>

                </div>

            </div>

        </div>


        <!-- Welcome Card -->

        <div class="card border-0 shadow-sm mt-4">

            <div class="card-body p-4">

                <h5>
                    Welcome to IBSBMS
                </h5>

                <p class="text-muted mb-0">
                    Shareholder management and Maker-Checker
                    approval system.
                </p>

            </div>

        </div>

    </div>

</main>

</body>
</html>
