<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>IBSBMS - Dashboard</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>


<!-- Main Content -->
<main class="main-content">

    <div class="page-content">

        <!-- Page Heading -->

        <h4 class="mb-1">
            Dashboard
        </h4>

        <p class="text-muted mb-4">
            Islami Bank Share & Bond Management System
        </p>


        <!-- Statistics -->

        <div class="row g-4">


            <!-- Total Shareholders -->

            <div class="col-md-3">

                <div class="card border-0 shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <p class="text-muted mb-2">
                                    Total Shareholders
                                </p>

                                <h3 class="mb-0 fw-semibold"
                                    th:text="${totalShareholders}">
                                    0
                                </h3>

                            </div>

                            <div class="fs-2 text-primary">

                                <i class="bi bi-people"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Active Accounts -->

            <div class="col-md-3">

                <div class="card border-0 shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <p class="text-muted mb-2">
                                    Active Accounts
                                </p>

                                <h3 class="mb-0 fw-semibold"
                                    th:text="${activeAccounts}">
                                    0
                                </h3>

                            </div>

                            <div class="fs-2 text-success">

                                <i class="bi bi-person-check"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Pending Approval -->

            <div class="col-md-3">

                <div class="card border-0 shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <p class="text-muted mb-2">
                                    Pending Approval
                                </p>

                                <h3 class="mb-0 fw-semibold"
                                    th:text="${pendingApprovals}">
                                    0
                                </h3>

                            </div>

                            <div class="fs-2 text-warning">

                                <i class="bi bi-hourglass-split"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Dormant Accounts -->

<!--            <div class="col-md-3">-->

<!--                <div class="card border-0 shadow-sm h-100">-->

<!--                    <div class="card-body">-->

<!--                        <div class="d-flex justify-content-between align-items-center">-->

<!--                            <div>-->

<!--                                <p class="text-muted mb-2">-->
<!--                                    Dormant Accounts-->
<!--                                </p>-->

<!--                                <h3 class="mb-0 fw-semibold"-->
<!--                                    th:text="${dormantAccounts}">-->
<!--                                    0-->
<!--                                </h3>-->

<!--                            </div>-->

<!--                            <div class="fs-2 text-secondary">-->

<!--                                <i class="bi bi-person-dash"></i>-->

<!--                            </div>-->

<!--                        </div>-->

<!--                    </div>-->

<!--                </div>-->

<!--            </div>-->


        </div>


        <!-- Welcome Card -->

        <div class="card border-0 shadow-sm mt-4">

            <div class="card-body p-4">

                <h5>
                    Welcome to IBSBMS
                </h5>

                <p class="text-muted mb-0">
                    Shareholder management and Maker-Checker
                    approval system.
                </p>

            </div>

        </div>


    </div>

</main>


<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
