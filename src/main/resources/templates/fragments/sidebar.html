<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<body>

<aside th:fragment="sidebar" class="sidebar">

    <!-- Logo -->
    <div class="sidebar-logo">
        <div class="logo-circle">
            IB
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">

        <a href="/" class="sidebar-link active">
            <span class="sidebar-icon">▦</span>
            <span>Dashboard</span>
        </a>

        <a href="/shareholders" class="sidebar-link">
            <span class="sidebar-icon">♙</span>
            <span>Shareholders</span>
        </a>

        <a href="/approvals" class="sidebar-link" th:if="${isChecker}">
            <span class="sidebar-icon">✓</span>
            <span>Approvals</span>
        </a>
        <a th:href="@{/my-requests}"
           class="sidebar-link"
           sec:authorize="hasRole('MAKER')">
            <span class="sidebar-icon">▤</span>
            <span>My Requests</span>
        </a>
        <a href="/approvals/rejected" class="sidebar-link" th:if="${isChecker}">
            <span class="sidebar-icon">✕</span>
            <span>Rejected Requests</span>
        </a>

        <a href="/approvals/returned"
           class="sidebar-link"
           th:if="${isChecker}">
            <span class="sidebar-icon">↩</span>
            <span>Returned Requests</span>
        </a>

        <a href="/shareholders/returned" class="sidebar-link" th:if="${isMaker}">
            <span class="sidebar-icon">↩</span>
            <span>Returned for Modification</span>
        </a>

    </nav>

</aside>

</body>
</html>
