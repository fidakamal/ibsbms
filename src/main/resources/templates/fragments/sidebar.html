<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<aside th:fragment="sidebar" class="sidebar">


    <div class="sidebar-logo">
        <div class="logo-circle">IB</div>
    </div>

    <nav class="sidebar-nav">

        <!-- Dashboard -->
        <a href="/"
           class="sidebar-link"
           data-tooltip="Dashboard"
           th:classappend="${currentUri == '/' or currentUri == '/dashboard'}
                        ? ' active'">

            <span class="sidebar-icon">▦</span>
            <span>Dashboard</span>

        </a>


        <!-- Shareholders -->
        <a href="/shareholders"
           class="sidebar-link"
           data-tooltip="Shareholders"
           th:classappend="${currentUri.startsWith('/shareholders')
                        and !currentUri.startsWith('/shareholders/returned')}
                        ? ' active'">

            <span class="sidebar-icon">♙</span>
            <span>Shareholders</span>

        </a>


        <!-- Approvals -->
        <a href="/approvals"
           class="sidebar-link"
           data-tooltip="Approvals"
           th:if="${isChecker}"
           th:classappend="${(currentUri == '/approvals'
                 or
                 (currentUri.startsWith('/approvals/')
                 and !currentUri.startsWith('/approvals/rejected')
                 and !currentUri.startsWith('/approvals/returned')))
                 and from != 'rejected'
                 and from != 'returned'}
                 ? ' active'">

            <span class="sidebar-icon">✓</span>
            <span>Approvals</span>

        </a>


        <!-- My Requests -->
        <a th:href="@{/my-requests}"
           class="sidebar-link"
           data-tooltip="My Requests"
           sec:authorize="hasRole('MAKER')"
           th:classappend="${currentUri.startsWith('/my-requests')}
                        ? ' active'">

            <span class="sidebar-icon">▤</span>
            <span>My Requests</span>

        </a>

        <!-- Share Transfer (Maker) -->
        <a th:href="@{/share-transfer}"
           class="sidebar-link"
           data-tooltip="Share Transfer"
           sec:authorize="hasRole('MAKER')"
           th:classappend="${currentUri == '/share-transfer'}
                        ? ' active'">

            <span class="sidebar-icon">⇅</span>
            <span>Share Transfer</span>

        </a>

        <!-- My Transfer Requests (Share Transfer Maker) -->
        <a th:href="@{/share-transfer/my-requests}"
           class="sidebar-link"
           data-tooltip="My Transfer Requests"
           sec:authorize="hasRole('MAKER')"
           th:classappend="${currentUri.startsWith('/share-transfer/my-requests')}
                        ? ' active'">

            <span class="sidebar-icon">⇄</span>
            <span>My Transfer Requests</span>

        </a>

        <!-- Rejected Requests -->
        <a href="/approvals/rejected"
           class="sidebar-link"
           data-tooltip="Rejected Requests"
           th:if="${isChecker}"
           th:classappend="${currentUri.startsWith('/approvals/rejected')
                 or from == 'rejected'}
                 ? ' active'">

            <span class="sidebar-icon">✕</span>
            <span>Rejected Requests</span>

        </a>


        <!-- Checker Returned Requests -->
        <a href="/approvals/returned"
           class="sidebar-link"
           data-tooltip="Returned Requests"
           th:if="${isChecker}"
           th:classappend="${currentUri.startsWith('/approvals/returned')
                 or from == 'returned'}
                 ? ' active'">

            <span class="sidebar-icon">↩</span>
            <span>Returned Requests</span>

        </a>


        <!-- Maker Returned Requests -->
        <a href="/shareholders/returned"
           class="sidebar-link"
           data-tooltip="Returned for Modification"
           th:if="${isMaker}"
           th:classappend="${currentUri.startsWith('/shareholders/returned')}
                        ? ' active'">

            <span class="sidebar-icon">↩</span>
            <span>Returned for Modification</span>

        </a>

    </nav>


</aside>

</body>
</html>
