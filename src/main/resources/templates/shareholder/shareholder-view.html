<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Shareholder Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

    <div class="page-content">

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">Shareholder Details</h2>

                <p class="text-muted mb-0">
                    View shareholder information
                </p>
            </div>

            <div>

                <a th:href="@{/shareholders}"
                   class="btn btn-outline-secondary btn-sm">
                    Back to Shareholders
                </a>

                <a th:href="@{/shareholders/{folioBo}/edit(folioBo=${folioBo})}"
                   class="btn btn-primary btn-sm"
                   sec:authorize="hasRole('MAKER')">
                    Edit
                </a>

            </div>

        </div>


        <!-- Basic Information -->
        <div class="form-section mb-4">

            <div class="form-section-header">
                <h5 class="mb-0">Basic Information</h5>
            </div>

            <div class="form-section-body">

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label">
                            Folio / BO
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.folioBo}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Customer Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.custName}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Father Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.fatherName}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Mother Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.motherName}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Spouse Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.spouseName}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Representative
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.representative}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.phone}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Email
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.email}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            Date of Birth
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.dob}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            NID No
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.nidNo}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            TIN No
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.tinNo}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">
                            ICB Code
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.basicInfo.icbCode}"
                               readonly>
                    </div>

                </div>

            </div>

        </div>


        <!-- Address -->
        <div class="form-section mb-4">

            <div class="form-section-header">
                <h5 class="mb-0">Address</h5>
            </div>

            <div class="form-section-body">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            Address Line 1
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.address.add1}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Address Line 2
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.address.add2}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Address Line 3
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.address.add3}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Address Line 4
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.address.add4}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Country
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.address.countryName}"
                               readonly>
                    </div>

                </div>

            </div>

        </div>


        <!-- Bank Information -->
        <div class="form-section mb-4">

            <div class="form-section-header">
                <h5 class="mb-0">Bank Information</h5>
            </div>

            <div class="form-section-body">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            Bank Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.bankInfo.bankName}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Account Number
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.bankInfo.accNo}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Branch Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.bankInfo.branchName}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Routing Number
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${shareholder.bankInfo.routingNo}"
                               readonly>
                    </div>

                </div>

            </div>

        </div>


        <!-- Bottom Actions -->
        <div class="d-flex justify-content-end gap-2">

            <a th:href="@{/shareholders}"
               class="btn btn-outline-secondary">
                Back
            </a>

            <a th:href="@{/shareholders/{folioBo}/edit(folioBo=${folioBo})}"
               class="btn btn-primary"
               sec:authorize="hasRole('MAKER')">
                Edit Shareholder
            </a>

        </div>

    </div>

</main>

</body>

</html>
