<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>IBSBMS - Share Accounts</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            th:href="@{/css/style.css}"
            rel="stylesheet">

</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>


<main class="main-content">

    <div class="page-content">

        <!-- Page heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h4 class="mb-1">
                    Share Accounts
                </h4>

                <p class="text-muted mb-0">
                    Manage shareholder accounts
                </p>
            </div>

            <a href="/shareholders/create"
               class="btn btn-primary">

                + New Shareholder

            </a>

        </div>


        <!-- Main card -->
        <div class="card border-0 shadow-sm">

            <div class="card-body">


                <!-- Search / actions -->

                <div class="row g-3 mb-4">

                    <div class="col-md-3">

                        <a href="/approvals"
                           class="btn btn-outline-secondary w-100">

                            Pending Approval

                        </a>

                    </div>


                    <div class="col-md-3">

                        <input
                                type="text"
                                class="form-control"
                                placeholder="Enter Folio No">

                    </div>


                    <div class="col-md-2">

                        <button
                                class="btn btn-outline-primary w-100">

                            Edit

                        </button>

                    </div>


                    <div class="col-md-2">

                        <button
                                class="btn btn-primary w-100">

                            Search

                        </button>

                    </div>


                    <div class="col-md-2">

                        <select class="form-select">

                            <option>10</option>
                            <option>25</option>
                            <option>50</option>
                            <option>100</option>

                        </select>

                    </div>

                </div>


                <!-- Table -->

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead class="share-table-header">

                        <tr>

                            <th>FOLIO BO</th>

                            <th>CUSTOMER NAME</th>

                            <th>ADDRESS</th>

                            <th>EMAIL</th>

                            <th>PHONE</th>

                            <th>SHARES</th>

                            <th>BALANCE</th>

                            <th>STATUS</th>

                        </tr>

                        </thead>





                        <tbody>

                        <tr th:each="shareholder : ${shareholders}">

                            <td th:text="${shareholder.folioBo}">
                                100001
                            </td>

                            <td th:text="${shareholder.custName}">
                                Abdul Karim
                            </td>

                            <td>
                                -
                            </td>

                            <td th:text="${shareholder.email}">
                                abdul@example.com
                            </td>

                            <td th:text="${shareholder.phone}">
                                01712345678
                            </td>

                            <td th:text="${shareholder.shares}">
                                500
                            </td>

                            <td th:text="${shareholder.balance}">
                                50,000
                            </td>

                            <td>

        <span
                th:if="${shareholder.isValid == 1}"
                class="badge bg-success">
            Valid
        </span>

                                <span
                                        th:unless="${shareholder.isValid == 1}"
                                        class="badge bg-secondary">
            Invalid
        </span>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>


                <!-- Bottom section -->

                <div class="d-flex justify-content-between align-items-center mt-3">

                    <small class="text-muted">

                        Showing 1-10 of 1470 entries

                    </small>


                    <nav>

                        <ul class="pagination pagination-sm mb-0">

                            <li class="page-item disabled">

                                <a class="page-link">
                                    Previous
                                </a>

                            </li>

                            <li class="page-item active">

                                <a class="page-link">
                                    1
                                </a>

                            </li>

                            <li class="page-item">

                                <a class="page-link">
                                    2
                                </a>

                            </li>

                            <li class="page-item">

                                <a class="page-link">
                                    3
                                </a>

                            </li>

                            <li class="page-item">

                                <a class="page-link">
                                    Next
                                </a>

                            </li>

                        </ul>

                    </nav>

                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
