<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Rejected Requests</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

    <div class="page-content">

        <!-- Page heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">Rejected Requests</h2>

                <p class="text-muted mb-0">
                    Shareholder requests that were rejected by a checker
                </p>
            </div>

            <div>
                <span class="badge bg-danger fs-6">
                    Rejected:
                    <span th:text="${rejectedCount}">0</span>
                </span>

                <a th:href="@{/approvals}" class="btn btn-outline-secondary btn-sm ms-2">
                    Back to Approvals
                </a>
            </div>

        </div>


        <!-- Rejected requests table -->
        <div class="form-section">

            <div class="form-section-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead>

                        <tr>

                            <th>Request ID</th>

                            <th>Operation</th>

                            <th>Folio BO</th>

                            <th>Maker</th>

                            <th>Rejected By</th>

                            <th>Rejected On</th>

                            <th>Reason</th>

                            <th class="text-end">
                                Action
                            </th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="request : ${rejectedRequests}">

                            <td th:text="${request.requestId}">
                                55
                            </td>

                            <td>
                                <span class="badge bg-info text-dark"
                                      th:text="${request.operationCode == 'SHAREHOLDER_CREATE'
                                                ? 'Create'
                                                : (request.operationCode == 'SHAREHOLDER_UPDATE'
                                                ? 'Modify'
                                                : request.operationCode)}">
                                    Create
                                </span>
                            </td>

                            <td>
                                <strong th:text="${request.businessRef}">
                                    24381
                                </strong>
                            </td>

                            <td th:text="${request.makerId}">
                                test.maker
                            </td>

                            <td th:text="${request.checkerId}">
                                test.checker
                            </td>

                            <td th:text="${#temporals.format(request.decidedAt, 'dd-MMM-yyyy HH:mm')}">
                                06-Sep-2026 10:00
                            </td>

                            <td th:text="${rejectionRemarks != null ? rejectionRemarks[request.requestId] : ''}">
                                Duplicate Folio BO.
                            </td>

                            <td class="text-end">
                                <a th:href="@{/approvals/{requestId}(requestId=${request.requestId})}"
                                   class="btn btn-sm btn-outline-secondary">
                                    View
                                </a>
                            </td>

                        </tr>


                        <!-- No rejected requests -->
                        <tr th:if="${#lists.isEmpty(rejectedRequests)}">

                            <td colspan="8"
                                class="text-center text-muted py-4">

                                No rejected requests found.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
