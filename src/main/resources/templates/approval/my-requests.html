<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Requests</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background-color: #F5F7F7;
            font-family: Arial, sans-serif;
        }

        .page-header {
            background-color: #174C4C;
            color: white;
            padding: 20px 30px;
        }

        .content {
            padding: 30px;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .status-rejected {
            background-color: #f8d7da;
            color: #842029;
        }

        .status-returned {
            background-color: #ffe5d0;
            color: #984c0c;
        }

        .status-other {
            background-color: #e2e3e5;
            color: #41464b;
        }

        table th {
            background-color: #285A78;
            color: white;
        }

    </style>

</head>

<body>

<div class="page-header">

    <h3 class="mb-1">
        My Requests
    </h3>

    <div>
        Shareholder Create Requests
    </div>

</div>


<div class="content">

    <div class="card">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h5 class="mb-0">
                    My Create Requests
                </h5>

                <span class="text-muted"
                      th:text="${#lists.size(requests)} + ' request(s)'">
                    0 request(s)
                </span>

            </div>


            <!-- Requests table -->

            <div class="table-responsive"
                 th:if="${not #lists.isEmpty(requests)}">

                <table class="table table-hover align-middle">

                    <thead>

                    <tr>

                        <th>Request ID</th>

                        <th>Folio / BO</th>

                        <th>Operation</th>

                        <th>Submitted</th>

                        <th>Status</th>

                        <th>Stage</th>

                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="request : ${requests}">

                        <td th:text="${request.requestId}">
                            1
                        </td>


                        <td th:text="${request.entityId}">
                            -
                        </td>


                        <td>
                            Create
                        </td>


                        <td th:text="${request.createdAt != null
                                      ? #temporals.format(request.createdAt, 'dd-MM-yyyy HH:mm')
                                      : '-'}">
                            -
                        </td>


                        <td>

                            <span
                                    th:if="${request.status == 'PENDING_CHECKER'}"
                                    class="status-badge status-pending">
                                Pending Checker
                            </span>

                            <span
                                    th:if="${request.status == 'APPROVED'}"
                                    class="status-badge status-approved">
                                Approved
                            </span>

                            <span
                                    th:if="${request.status == 'REJECTED'}"
                                    class="status-badge status-rejected">
                                Rejected
                            </span>

                            <span
                                    th:if="${request.status == 'RETURNED_FOR_MODIFICATION'}"
                                    class="status-badge status-returned">
                                Returned
                            </span>

                            <span
                                    th:if="${request.status != 'PENDING_CHECKER'
                                           and request.status != 'APPROVED'
                                           and request.status != 'REJECTED'
                                           and request.status != 'RETURNED_FOR_MODIFICATION'}"
                                    class="status-badge status-other"
                                    th:text="${request.status}">
                                Status
                            </span>

                        </td>


                        <td th:text="${request.currentStage}">
                            CHECKER
                        </td>


                        <td>

                            <a
                                    th:href="@{/approvals/{id}(id=${request.requestId})}"
                                    class="btn btn-sm btn-primary">
                                View
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>


            <!-- Empty state -->

            <div
                    th:if="${#lists.isEmpty(requests)}"
                    class="text-center py-5">

                <h5 class="text-muted">
                    No create requests found
                </h5>

                <p class="text-muted mb-0">
                    You have not submitted any shareholder create requests yet.
                </p>

            </div>

        </div>

    </div>

</div>

</body>

</html>
