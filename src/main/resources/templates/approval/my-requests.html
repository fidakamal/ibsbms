<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>IBSBMS - My Requests</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            th:href="@{/css/style.css}"
            rel="stylesheet">

    <style>

        .request-table {
            width: 100%;
        }

        .request-table th,
        .request-table td {
            vertical-align: middle;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .approved {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .rejected {
            background-color: #f8d7da;
            color: #842029;
        }

        .returned {
            background-color: #ffe5d0;
            color: #984c0c;
        }

        .other {
            background-color: #e2e3e5;
            color: #41464b;
        }

        .view-button {
            white-space: nowrap;
        }

    </style>

</head>

<body>

<!-- Sidebar -->

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- Header -->

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

    <div class="page-content">

        <!-- Page heading -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h4 class="mb-1">
                    My Requests
                </h4>

                <p class="text-muted mb-0">
                    Shareholder Create Requests
                </p>

            </div>

        </div>


        <!-- Main card -->

        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <!-- Card heading -->

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h5 class="mb-0">
                        My Create Requests
                    </h5>

                    <span class="text-muted"
                          th:text="${#lists.size(requests)} + ' request(s)'">
                        0 request(s)
                    </span>

                </div>


                <!-- Request table -->

                <div class="table-responsive"
                     th:if="${not #lists.isEmpty(requests)}">

                    <table class="table table-striped table-hover align-middle request-table">

                        <thead class="share-table-header">

                        <tr>

                            <th>
                                REQUEST ID
                            </th>

                            <th>
                                FOLIO / BO
                            </th>

                            <th>
                                OPERATION
                            </th>

                            <th>
                                SUBMITTED
                            </th>

                            <th>
                                STATUS
                            </th>

                            <th>
                                STAGE
                            </th>

                            <th>
                                ACTIONS
                            </th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="request : ${requests}">

                            <!-- Request ID -->

                            <td th:text="${request.requestId}">
                                1
                            </td>


                            <!-- Folio / BO -->

                            <td th:text="${request.entityId}">
                                -
                            </td>


                            <!-- Operation -->

                            <td>
                                Create
                            </td>


                            <!-- Submitted -->

                            <td th:text="${request.createdAt != null
                                ? #temporals.format(
                                    request.createdAt,
                                    'dd-MM-yyyy HH:mm'
                                  )
                                : '-'}">

                                -

                            </td>


                            <!-- Status -->

                            <td>

                                <span
                                        th:if="${request.status == 'PENDING_CHECKER'}"
                                        class="status-badge pending">

                                    Pending Checker

                                </span>


                                <span
                                        th:if="${request.status == 'APPROVED'}"
                                        class="status-badge approved">

                                    Approved

                                </span>


                                <span
                                        th:if="${request.status == 'REJECTED'}"
                                        class="status-badge rejected">

                                    Rejected

                                </span>


                                <span
                                        th:if="${request.status == 'RETURNED_FOR_MODIFICATION'}"
                                        class="status-badge returned">

                                    Returned

                                </span>


                                <span
                                        th:if="${request.status != 'PENDING_CHECKER'
                                            and request.status != 'APPROVED'
                                            and request.status != 'REJECTED'
                                            and request.status != 'RETURNED_FOR_MODIFICATION'}"
                                        class="status-badge other"
                                        th:text="${request.status}">

                                    Status

                                </span>

                            </td>


                            <!-- Stage -->

                            <td th:text="${request.currentStage}">
                                CHECKER
                            </td>


                            <!-- Actions -->

                            <td>

                                <a
                                        th:href="@{/my-requests/{requestId}(requestId=${request.requestId})}"
                                        class="btn btn-sm btn-outline-primary view-button">

                                    View

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>


                <!-- No requests -->

                <div
                        th:if="${#lists.isEmpty(requests)}"
                        class="text-center py-5">

                    <h5 class="text-muted">
                        No create requests found
                    </h5>

                    <p class="text-muted mb-0">
                        You have not submitted any shareholder create requests yet.
                    </p>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
