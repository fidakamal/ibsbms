<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Approvals</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

    <div class="page-content">

        <!-- Page heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">Approvals</h2>

                <p class="text-muted mb-0">
                    Review and process pending shareholder requests
                </p>
            </div>

            <div>
                <span class="badge bg-warning text-dark fs-6">
                    Pending:
                    <span th:text="${pendingCount}">3</span>
                </span>
            </div>

        </div>


        <!-- Flash messages -->
        <div th:if="${param.success}" class="alert alert-success">
            <span th:text="${param.success}">Done.</span>
        </div>
        <div th:if="${param.error}" class="alert alert-danger">
            <span th:text="${param.error}">Error.</span>
        </div>


        <!-- Approval table -->
        <div class="form-section">

            <div class="form-section-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead>

                        <tr>

                            <th>Request ID</th>

                            <th>Operation</th>

                            <th>Folio BO</th>

                            <th>Maker</th>

                            <th>Business Date</th>

                            <th>Status</th>

                            <th class="text-start">Action</th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="req : ${requests}">

                            <td th:text="${req.requestId}">
                                100001
                            </td>

                            <td>
                                <span class="badge bg-info text-dark"
                                      th:text="${req.operationCode == 'SHAREHOLDER_CREATE'} ? 'Create' : 'Modify'">
                                    Create
                                </span>
                            </td>

                            <td>
                                <strong th:text="${req.businessRef}">FOLIO-000001</strong>
                            </td>

                            <td th:text="${req.makerId}">
                                test.maker
                            </td>

                            <td th:text="${req.businessDate}">
                                04-Sep-2026
                            </td>

                            <td>
                                <span class="badge"
                                      th:classappend="
                                          ${req.status == 'APPROVED'} ? ' bg-success' :
                                          (${req.status == 'REJECTED'} ? ' bg-danger' :
                                          (${req.status == 'RETURNED_FOR_MODIFICATION'} ? ' bg-warning text-dark' :
                                          ' bg-warning text-dark'))
                                      "
                                      th:text="${req.status}">
                                    PENDING_CHECKER
                                </span>
                            </td>

                            <td>
                                <a th:href="@{/approvals/{id}(id=${req.requestId})}"
                                   class="btn btn-sm btn-primary"
                                   th:text="'Review'">
                                </a>
                            </td>

                        </tr>


                        <tr th:if="${#lists.isEmpty(requests)}">

                            <td colspan="7" class="text-center text-muted py-4">
                                No approval requests found.
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
