<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Approvals</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-content">

    <div class="page-content">

        <!-- Page heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">Approvals</h2>

                <p class="text-muted mb-0">
                    Review and process pending shareholder requests
                </p>
            </div>

            <div>
                <span class="badge bg-warning text-dark fs-6">
                    Pending:
                    <span th:text="${pendingCount}">0</span>
                </span>

                <a th:href="@{/approvals/rejected}" class="btn btn-outline-danger btn-sm ms-2">
                    View Rejected
                </a>
            </div>

        </div>


        <!-- Search / filter section -->
        <div class="form-section">

            <div class="form-section-body">

                <div class="row g-3">

                    <div class="col-md-4">

                        <label class="form-label">
                            Folio BO
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter Folio BO">

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Operation
                        </label>

                        <select class="form-select">

                            <option value="">
                                All
                            </option>

                            <option value="SHAREHOLDER_CREATE">
                                Shareholder Create
                            </option>

                            <option value="SHAREHOLDER_UPDATE">
                                Shareholder Modify
                            </option>

                        </select>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select class="form-select">

                            <option>
                                Pending Checker
                            </option>

                            <option>
                                Returned
                            </option>

                            <option>
                                All
                            </option>

                        </select>

                    </div>


                    <div class="col-md-2 d-flex align-items-end">

                        <button type="button"
                                class="btn btn-primary w-100">

                            Search

                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- Pending approval table -->
        <div class="form-section">

            <div class="form-section-body">

                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead>

                        <tr>

                            <th>Request ID</th>

                            <th>Operation</th>

                            <th>Folio BO</th>

                            <th>Maker</th>

                            <th>Business Date</th>

                            <th>Status</th>

                            <th class="text-end">
                                Action
                            </th>

                        </tr>

                        </thead>


                        <tbody>

                        <!-- Real database approval requests -->
                        <tr th:each="request : ${approvalRequests}">

                            <td th:text="${request.requestId}">
                                55
                            </td>

                            <td>

                                <span class="badge bg-info text-dark"
                                      th:text="${request.operationCode == 'SHAREHOLDER_CREATE'
                                                ? 'Create'
                                                : (request.operationCode == 'SHAREHOLDER_UPDATE'
                                                ? 'Modify'
                                                : request.operationCode)}">
                                    Create
                                </span>

                            </td>

                            <td>

                                <strong th:text="${request.businessRef}">
                                    24381
                                </strong>

                            </td>

                            <td th:text="${request.makerId}">
                                test.maker
                            </td>

                            <td th:text="${#temporals.format(request.businessDate, 'dd-MMM-yyyy')}">
                                06-Sep-2026
                            </td>

                            <td>

                                <span class="badge bg-warning text-dark"
                                      th:text="${request.status == 'PENDING_CHECKER'
                                                ? 'Pending Checker'
                                                : request.status}">
                                    Pending Checker
                                </span>

                            </td>

                            <td class="text-end">

                                <a th:href="@{/approvals/{requestId}(requestId=${request.requestId})}"
                                   class="btn btn-sm btn-primary">
                                    Review
                                </a>

                            </td>

                        </tr>


                        <!-- No pending requests -->
                        <tr th:if="${#lists.isEmpty(approvalRequests)}">

                            <td colspan="7"
                                class="text-center text-muted py-4">

                                No pending approval requests found.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</main>

</body>

</html>
